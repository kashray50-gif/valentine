<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine? 💖</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
    }

    .container {
        background: rgba(255,255,255,0.92);
        padding: 30px;
        border-radius: 25px;
        text-align: center;
        width: 90%;
        max-width: 380px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    h1 {
        color: #e91e63;
        margin-bottom: 15px;
        font-size: 24px;
    }

    p {
        color: #444;
        margin-bottom: 20px;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 14px;
        margin: 8px 0;
        border: none;
        border-radius: 30px;
        font-size: 16px;
        cursor: pointer;
        background: #ff4d6d;
        color: white;
    }

    button:active {
        transform: scale(0.97);
        background: #e91e63;
    }

    #result {
        display: none;
        margin-top: 20px;
        font-size: 17px;
        color: #d6336c;
        line-height: 1.6;
    }

    .heart {
        position: fixed;
        color: red;
        font-size: 20px;
        animation: float 6s linear infinite;
        pointer-events: none;
    }

    @keyframes float {
        0% { transform: translateY(100vh); opacity: 1; }
        100% { transform: translateY(-10vh); opacity: 0; }
    }
</style>
</head>

<body>

<div class="container">
    <h1>💖 Will You Be My Valentine? 💖</h1>
    <p>Choose one option 😄👇</p>

    <button onclick="showYes()">A. Yes 💘</button>
    <button onclick="showYes()">B. Option A 😆</button>
    <button onclick="showYes()">C. Option B 😂</button>
    <button onclick="showYes()">D. All of the above 😍</button>

    <div id="result">
        💕 YAYYYYY!!! 💕<br><br>
        Will you go on a Valentine date with me on  
        <b>February 14 ❤️</b><br><br>
        🌹 Can’t wait to spend that day with you 🌹
    </div>
</div>

<script>
function showYes() {
    document.getElementById("result").style.display = "block";
}

/* floating hearts */
for (let i = 0; i < 25; i++) {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";
    heart.style.fontSize = (16 + Math.random() * 20) + "px";
    document.body.appendChild(heart);
}
</script>

</body>
</html>
